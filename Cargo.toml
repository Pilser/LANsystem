[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/storage",
    "crates/platform/core",
    "crates/business-apps/app-contract",
    "crates/business-apps/media",
    "apps/lan",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# --- DB stack ---
helix-db = { version = "3.0.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# --- Storage stack (RustFS over S3) ---
aws-config = "1.6"
aws-sdk-s3 = { version = "1.90", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "1.2"
bytes = "1"

# --- Full-stack web framework ---
topcoat = { version = "0.5.0", features = ["websocket", "multipart", "sse", "htmx", "tailwind"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"