[workspace]
resolver = "2"
members = [
    "crates/db",
    "crates/storage",
    "crates/serverless-core",
    "crates/serverless-expr",
    "crates/serverless-recipe",
    "crates/platform/core",
    "crates/platform/auth",
    "crates/business-apps/app-contract",
    "crates/business-apps/media",
    "crates/business-apps/marketplace",
    "crates/business-apps/serverless",
    "crates/business-apps/agent",
    "crates/business-apps/admin",
    "crates/business-apps/onboarding",
    "apps/lan",
]
exclude = ["topcoat", "helix-db", "turso"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
argon2 = "0.5"

# --- DB stack ---
helix-db = { version = "3.0.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# --- Storage stack (RustFS over S3) ---
aws-config = "1.6"
aws-sdk-s3 = { version = "1.90", default-features = false, features = ["rt-tokio"] }
aws-credential-types = "1.2"
bytes = "1"

# --- Serverless boards ---
# Traits + types registry only; the turso engine (vendored at ../turso) is a
# separate workspace with its own lockfile and is wired in by the serverless
# business app, mirroring zerowrapper's path dependency.
serverless-core = { path = "crates/serverless-core" }
turso = { path = "turso/bindings/rust" }
sha2 = "0.10"
rand = "0.9"
chrono = "0.4"
anyhow = "1"
aes-gcm = "0.10"

# --- Full-stack web framework ---
topcoat = { version = "0.5.0", features = ["websocket", "multipart", "sse", "htmx", "tailwind"] }

[patch.crates-io]
topcoat = { path = "topcoat/crates/topcoat" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"