[package]
name = "lan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LANsystem binary facade — wires all crates, no business logic"

[[bin]]
name = "lan"
path = "src/main.rs"

[dependencies]
topcoat = { workspace = true }
platform-core = { path = "../../crates/platform/core" }
app-contract = { path = "../../crates/business-apps/app-contract" }
media-app = { path = "../../crates/business-apps/media" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true