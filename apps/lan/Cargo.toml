[package]
name = "lan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LANsystem binary facade — wires all crates, no business logic"

[[bin]]
name = "lan"
path = "src/main.rs"

[dependencies]
topcoat = { workspace = true }
platform-core = { path = "../../crates/platform/core" }
platform-auth = { path = "../../crates/platform/auth" }
app-contract = { path = "../../crates/business-apps/app-contract" }
media-app = { path = "../../crates/business-apps/media" }
marketplace-app = { path = "../../crates/business-apps/marketplace" }
onboarding-app = { path = "../../crates/business-apps/onboarding" }
admin-app = { path = "../../crates/business-apps/admin" }
agent-app = { path = "../../crates/business-apps/agent" }
serverless-app = { path = "../../crates/business-apps/serverless" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
topcoat = { workspace = true, features = ["tailwind"] }

[lints]
workspace = true